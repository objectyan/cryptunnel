[package]
name = "cryptunnel-crypto"
version = "0.1.2"
edition = "2021"
description = "Cryptunnel 隧道加密核心（Rust 重写）：AES-CBC-HMAC / AES-GCM / SM4-CBC-HMAC，与 Java/.NET 字节级兼容"
license = "Apache-2.0"

[workspace]
members = [".", "../cryptunnel-tunnel", "../cryptunnel-app/src-tauri"]

# release 优化配置必须在 workspace 根才生效（成员包里的 profile 会被忽略）。
# 主要给 cryptunnel-app 出包用：体积小、链接时优化。
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[dependencies]
aes = "0.8"
cbc = "0.1"
aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
subtle = "2"
rand = "0.8"
hex = "0.4"

[dev-dependencies]
