[package]
name = "cryptunnel-app"
version = "0.1.8"
edition = "2021"
description = "Cryptunnel 隧道客户端（Rust + Tauri 重写，多平台托盘工具）"
license = "Apache-2.0"
default-run = "cryptunnel-app"
# workspace 根在 ../../cryptunnel-crypto（cargo ≥1.90 起成员在根目录之外时必须显式指回根，否则硬错误）
workspace = "../../cryptunnel-crypto"

[lib]
name = "cryptunnel_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
cryptunnel-crypto = { path = "../../cryptunnel-crypto" }
cryptunnel-tunnel = { path = "../../cryptunnel-tunnel" }
tokio = { version = "1", features = ["full"] }

# 读取/修正 HKCU\...\Run 里的自启命令行：插件只在 enable() 时写注册表，已存在的旧项
# 不会自我更新，需要启动时补一次参数（见 lib.rs 的 repair_autostart_cmd）。
# 版本与 workspace 里已有的 winreg 0.55 对齐，离线构建可复用同一份源码。
[target.'cfg(windows)'.dependencies]
winreg = "0.55"

# 注意：[profile.release] 在 workspace 根（cryptunnel-crypto/Cargo.toml），成员包里的 profile 会被 cargo 忽略。
