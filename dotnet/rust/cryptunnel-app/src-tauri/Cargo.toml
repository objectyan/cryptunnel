[package]
name = "cryptunnel-app"
version = "0.1.0"
edition = "2021"
description = "Cryptunnel 隧道客户端（Rust + Tauri 重写，多平台托盘工具）"
license = "Apache-2.0"
default-run = "cryptunnel-app"

[lib]
name = "cryptunnel_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cryptunnel-crypto = { path = "../../cryptunnel-crypto" }
cryptunnel-tunnel = { path = "../../cryptunnel-tunnel" }
tokio = { version = "1", features = ["full"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
