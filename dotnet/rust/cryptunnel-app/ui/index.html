<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cryptunnel 隧道客户端</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="head">
      <img src="icon.png" alt="logo" class="logo" />
      <div>
        <h1>Cryptunnel</h1>
        <p class="sub">Rust + Tauri 多平台隧道客户端</p>
      </div>
      <span id="tunnel-badge" class="badge badge-idle">已停止</span>
    </header>

    <!-- 隧道配置 -->
    <section class="card">
      <h2>隧道连接</h2>
      <div class="grid">
        <label>服务端地址
          <input id="f-server" type="text" placeholder="http://host:8080" value="http://localhost:8080" />
        </label>
        <label>本地端口
          <input id="f-port" type="number" value="3307" />
        </label>
        <label>加密密钥 (aesKey)
          <input id="f-aes" type="password" placeholder="aesKey" />
        </label>
        <label>认证密钥 (authKey)
          <input id="f-auth" type="password" placeholder="authKey" />
        </label>
        <label>加密算法
          <select id="f-cipher">
            <option value="aes-256-cbc-hmac-sha256" selected>aes-256-cbc-hmac-sha256</option>
            <option value="aes-256-gcm">aes-256-gcm</option>
            <option value="sm4-cbc-hmac-sha256">sm4-cbc-hmac-sha256</option>
          </select>
        </label>
        <label>目标 target（可空）
          <input id="f-target" type="text" placeholder="缺省 target" />
        </label>
      </div>
      <div class="row">
        <button id="btn-start" class="primary">启动隧道</button>
        <button id="btn-stop" disabled>停止隧道</button>
      </div>
      <p class="hint">DBeaver 连接 <code>localhost:<span id="echo-port">3307</span></code>，账密填 MySQL 真实账号。</p>
    </section>

    <!-- 实时日志 -->
    <section class="card">
      <h2>运行日志</h2>
      <div id="log" class="log"></div>
    </section>

    <!-- 系统 -->
    <section class="card">
      <h2>系统</h2>
      <label class="switch-row">
        <input type="checkbox" id="autostart" />
        <span>登录系统后自动启动 Cryptunnel</span>
      </label>
      <div class="row" style="margin-top:12px">
        <button id="btn-hide">隐藏到托盘</button>
        <button id="btn-crypto">加密层自检</button>
      </div>
      <pre id="output" class="output" style="display:none"></pre>
    </section>

    <footer class="foot">
      <span>托盘图标在系统通知区 · 右键出菜单 · 左键唤起本窗口 · 关窗不退出（后台常驻）</span>
    </footer>
  </main>

  <script type="module" src="main.js"></script>
</body>
</html>
