# ============================================================================
# 全局默认值文件
#
# 本文件为 config.d/ 下的所有项目提供默认值。
# 约定：文件名以 00- 开头的 YAML 会被当作「默认值文件」解析其 defaults: 段，
#       其余 YAML 文件解析其 project: 段作为独立项目。
#
# 合并顺序：内置默认值  <-  defaults: 段  <-  项目自身字段
# 项目里显式写了的字段覆盖这里的；没写的就落到这里；这里也没有的用内置默认值。
# ============================================================================

schemaVersion: 1

defaults:
  # ------------------------------------------------------------------
  # 基础
  # ------------------------------------------------------------------

  # 是否随客户端启动。false 时该项目仍显示在列表里，但不会自动监听端口。
  # 临时不想用某个项目就把它改成 false，比删文件省事。
  enabled: true

  # WebSocket 端点路径。最终 URL = serverUrl 换成 ws:// 或 wss:// 后拼上这个路径。
  wsPath: /ws-cryptunnel

  # 本地监听地址。
  # !! 安全提示 !! 默认锁在 127.0.0.1，只有本机能连。
  # 改成 0.0.0.0 会让同网段所有人都能连你的隧道，等于把内网 MySQL 敞出去，
  # 且绕过了服务端的访问控制。真要改，客户端启动时会在托盘弹警告。
  listenAddress: 127.0.0.1

  # ------------------------------------------------------------------
  # 传输模式
  # ------------------------------------------------------------------

  # auto     —— 先试 WebSocket，失败自动降级为 HTTP 长轮询（默认）
  # wsOnly   —— 只用 WebSocket。适合确定 WAF 不拦的环境，能省掉每次白等 WS 超时
  # httpOnly —— 只用 HTTP 长轮询。适合 WAF 把 WebSocket 拦死的环境，直接跳过 WS 探测
  mode: auto

  # ------------------------------------------------------------------
  # 超时（毫秒）—— 不同项目的服务端响应差异大，这些值写死最容易踩坑
  # ------------------------------------------------------------------

  # WebSocket 连接建立的超时。超时即判定被 WAF 拦截并尝试降级。
  wsConnectTimeoutMs: 10000

  # HTTP 模式的连接超时
  httpConnectTimeoutMs: 10000

  # HTTP 模式的读取超时。跑大查询时若频繁超时，调大这个值。
  httpReadTimeoutMs: 30000

  # 发出加密认证后等待服务端处理的时间。
  # 原 Java 版写死 sleep 500ms，网络慢时会误判成认证失败，这里开放成配置项。
  authWaitMs: 500

  # ------------------------------------------------------------------
  # 重连
  # ------------------------------------------------------------------

  # 隧道异常断开后是否自动重连
  autoReconnect: true

  # 重连前的等待间隔
  reconnectDelayMs: 3000

  # ------------------------------------------------------------------
  # 日志与高级
  # ------------------------------------------------------------------

  # 是否记录该项目的日志（关掉可以减少日志噪音）
  logEnabled: true

  # 分片读缓冲大小，决定单帧大小。
  # !! 不要随便改 !! 见 docs/adr/0001-websocket-tunnel-frame-size-contract.md
  # 4096 经 AES+Base64 后约 5.5KB，稳稳低于服务端单帧上限，
  # 调大会触发 WebSocket 1009 CLOSE_TOO_BIG。
  chunkSize: 4096

  # 隧道加密算法。
  # !! 改这一项必须同时改服务端 !! 见 docs/adr/0003-pluggable-tunnel-cipher.md
  # 报文里不含算法标识，两端靠配置约定一致；配不一致会在认证阶段直接失败。
  #
  #   aes-256-cbc-hmac-sha256  默认，与所有历史版本兼容。
  #                            帧 = Base64(IV[16] || HMAC[32] || AES-CBC 密文)
  #   aes-256-gcm              AEAD，认证标签替代外挂 HMAC，每帧比默认算法省 24 字节。
  #                            帧 = Base64(nonce[12] || 密文 || tag[16])
  #   sm4                      国密 SM4-CBC + HMAC-SHA256，帧结构与默认算法完全相同。
  #                            等同于写 sm4-cbc-hmac-sha256。
  #                            服务端需引入 org.bouncycastle:bcprov-jdk18on 依赖；
  #                            本客户端内置 SM4 实现，无需额外依赖。
  #
  # 三种算法共用同一把 aesKey，各自派生独立子密钥，切换算法不用换密钥。
  cipher: aes-256-cbc-hmac-sha256
