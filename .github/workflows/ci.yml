name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 注意：core 与 starter 不在根 pom 的 reactor 内，必须各自 cd 构建
      - name: Build and test core
        working-directory: cryptunnel-core
        run: mvn -B clean install

      - name: Build starter (boot25 / javax)
        working-directory: cryptunnel-spring-boot-starter
        run: mvn -B -Pboot25 clean install

      - name: Build starter (jakarta)
        working-directory: cryptunnel-spring-boot-starter
        run: mvn -B -Pjakarta clean install
