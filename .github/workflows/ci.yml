name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  java-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven
      - name: Build and test core (JDK8 target)
        working-directory: java/cryptunnel-core
        run: mvn -B clean install

  java-boot25:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven
      - name: Build starter (boot25 / javax)
        working-directory: java
        run: mvn -B -Pboot25 clean install

  java-jakarta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build starter (jakarta)
        working-directory: java
        run: mvn -B -Pjakarta clean install

  # 客户端唯一实现 = Rust + Tauri（.NET/WPF 已退役）。跑测试保证隧道/加密/配置层不坏。
  rust-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: dotnet/rust/cryptunnel-crypto
      - name: "cargo test (workspace: crypto + tunnel)"
        working-directory: dotnet/rust/cryptunnel-crypto
        run: cargo test --workspace --exclude cryptunnel-app
      # tauri 在 Linux 编译需 webkit2gtk/gtk 等系统库（glib-sys 等 -sys crate 链接时要找），
      # 不装则 cargo check 报 "failed to run custom build command for glib-sys"
      - name: Install Linux system dependencies (for tauri check)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: "cargo check (tauri app)"
        working-directory: dotnet/rust/cryptunnel-app/src-tauri
        run: cargo check
