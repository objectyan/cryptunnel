name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  java-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven
      - name: Build and test core (JDK8 target)
        working-directory: java/cryptunnel-core
        run: mvn -B clean install

  java-boot25:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven
      - name: Build starter (boot25 / javax)
        working-directory: java
        run: mvn -B -Pboot25 clean install

  java-jakarta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build starter (jakarta)
        working-directory: java
        run: mvn -B -Pjakarta clean install

  dotnet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        working-directory: dotnet/src
        run: dotnet restore Cryptunnel.App/Cryptunnel.App.csproj
      - name: Build
        working-directory: dotnet/src
        run: dotnet build Cryptunnel.App/Cryptunnel.App.csproj -c Release --no-restore
