# Rust + Tauri 客户端（多平台）发布流水线：打 v* 标签时用 tauri-action 三平台打包并传到 GitHub Releases。
#
# 用法（版本号以 tauri.conf.json / Cargo.toml 为准，标签须与之对应）：
#   git tag v0.2.0
#   git push origin v0.2.0
#
# 产物（按平台，传到 Release 资产）：
#   Windows:  Cryptunnel_<ver>_x64-setup.exe / .msi  (+ .sig 更新签名)
#   macOS:    Cryptunnel_<ver>_universal.dmg / .app.tar.gz (+ .sig)
#   Linux:    Cryptunnel_<ver>_amd64.AppImage / .deb (+ .sig)
#   latest.json                                   更新清单（tauri-plugin-updater 据此找最新版）
#
# 更新签名（必配，否则 createUpdaterArtifacts 失败）：
#   1. 本地执行一次 `cargo tauri signer generate -w ~/.tauri/cryptunnel.key` 得到一对密钥
#   2. 公钥填进 src-tauri/tauri.conf.json 的 plugins.updater.pubkey
#   3. 私钥存到仓库 Secrets：TAURI_SIGNING_PRIVATE_KEY（及可选 TAURI_SIGNING_PRIVATE_KEY_PASSWORD）
#
# 注意：本 workflow 与 release.yml（.NET/WPF 客户端）相互独立，但都监听 v* 标签。
#       打标签前请确认要发的是哪一套，避免两套同时发（或后续拆分标签前缀）。

name: Release Tauri

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # 上传 Release 资产所需

jobs:
  release-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: universal-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version from tag
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "Releasing version $v"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # universal-apple-darwin 不是真实 rust target（rustup 装不了，v0.1.0 macOS 挂在
      # 「Install Rust」）。它是 tauri build 的 lipo 合并模式：需先装 x86_64 + aarch64
      # 两个真实 target，再只把 universal 传给 tauri build 的 --target。
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target == 'universal-apple-darwin' && 'x86_64-apple-darwin,aarch64-apple-darwin' || matrix.target }}

      # Linux 打包需要 webkit2gtk 等系统依赖（tauri 官方前置要求）
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: dotnet/rust/cryptunnel-crypto
          cache-on-failure: true

      # tauri-action 只负责「构建 + 平台打包 + 更新签名」，不接 Release 上传。
      # 我们的前端是纯静态（无构建步骤），故不设 beforeBuildCommand。
      #
      # 坑（v0.1.0 首发踩过，三平台全 "No artifacts were found"）：
      #   本仓库 cargo workspace 根在 cryptunnel-crypto/（target 目录共享），
      #   打包产物实际落在 cryptunnel-crypto/target/release/bundle/。
      #   而 tauri-action 的 workspace 检测只在「workspace 根 == src-tauri 父目录」时
      #   才对得上路径；本仓库 Tauri 项目根(cryptunnel-app)不是 workspace 根，
      #   action 错去 src-tauri/target/... 找 → 找不到。
      #   故 release 上传改为下面手动 glob（按真实产物路径），不依赖 action 的路径推断。
      - name: Build Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: dotnet/rust/cryptunnel-app
          args: --target ${{ matrix.target }}

      # 产物真实位置（v0.1.0 第三次 run 实锤，Windows job 日志 "Finished 2 bundles at"）：
      #   cryptunnel-crypto/target/<TARGET-TRIPLE>/release/bundle/<type>/
      # 中间有一层 /<target triple>/ —— 因为 cargo build 传了 --target。
      # macOS 用 --target universal-apple-darwin 时该层目录名即 matrix.target 本身。
      #
      # 用 shell 步骤把本平台的安装包 + .sig 收集到 dist-bundles/：
      # 不用 action-gh-release 的 files glob 枚举 bundle 类型——三平台共享一份 files
      # 列表时，每平台必然有枚举项不存在（Windows 上没有 dmg…），开
      # fail_on_unmatched_files 就会误伤（v0.1.0 第四次 run 三平台全挂于此）。
      # 这里 nullglob + 计数 == 0 硬失败：本平台一个产物都没有才是真失败。
      - name: Collect bundles into dist-bundles
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p dist-bundles
          B="dotnet/rust/cryptunnel-crypto/target/${{ matrix.target }}/release/bundle"
          n=0
          for f in "$B"/nsis/*.exe "$B"/nsis/*.exe.sig \
                   "$B"/msi/*.msi "$B"/msi/*.msi.sig \
                   "$B"/dmg/*.dmg "$B"/dmg/*.dmg.sig \
                   "$B"/macos/*.app.tar.gz "$B"/macos/*.app.tar.gz.sig \
                   "$B"/appimage/*.AppImage "$B"/appimage/*.AppImage.sig \
                   "$B"/deb/*.deb "$B"/deb/*.deb.sig; do
            cp -v "$f" dist-bundles/
            n=$((n+1))
          done
          if [ "$n" -eq 0 ]; then
            echo "::error::未收集到任何产物，目录 $B 不存在或为空"
            ls -la "$B" || true
            exit 1
          fi
          echo "collected $n files"

      - name: Upload Release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Cryptunnel v${{ env.VERSION }}
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: dist-bundles/*

  # updater 清单 latest.json：tauri-action 只在「它自己持有 releaseId」时生成，
  # 我们改成 build-only + 手动上传后这条链路断了（v0.1.0 第三次 run 草稿无 latest.json）。
  # updater 插件已启用（lib.rs 注册 + tauri.conf.json endpoints 指
  # releases/latest/download/latest.json），缺清单 = 所有客户端自动更新静默失效。
  # 故在 matrix 全绿后单跑一个 job，读草稿资产里的 .sig 内容，按 tauri-action
  # upload-version-json.ts 同款结构生成 latest.json 补上。
  upload-updater-json:
    needs: release-tauri
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Resolve version from tag
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Generate and upload latest.json
        run: |
          set -euo pipefail
          python3 - "${{ github.repository }}" "${{ github.ref_name }}" "$VERSION" <<'PYEOF'
          import sys, json, subprocess, datetime
          repo, tag, ver = sys.argv[1], sys.argv[2], sys.argv[3]

          def gh(*args):
              r = subprocess.run(['gh', 'api', *args], capture_output=True, text=True)
              if r.returncode != 0:
                  raise SystemExit(f'gh api {args} 失败: {r.stderr}')
              return r.stdout

          rel_list = json.loads(gh(f'repos/{repo}/releases?per_page=100'))
          rel = next((r for r in rel_list if r['tag_name'] == tag), None)
          if rel is None:
              raise SystemExit(f'找不到 tag={tag} 的 release（含草稿）')
          # by-tag 端点（releases/tags/<tag> 与 gh release view）对草稿返回 404，
          # 必须按 id 取详情。
          rel = json.loads(gh(f"repos/{repo}/releases/{rel['id']}"))
          assets = {a['name']: a['id'] for a in rel['assets']}
          print('release id:', rel['id'], 'draft:', rel['draft'], 'assets:', len(assets))
          for n in sorted(assets):
              print('  ', n)

          def sig(name):
              if name not in assets:
                  return ''
              return gh(f'repos/{repo}/releases/assets/{assets[name]}',
                        '-H', 'Accept: application/octet-stream')

          dl = f'https://github.com/{repo}/releases/download/{tag}'
          entries = {}

          def add(keys, sig_name, url_name):
              s = sig(sig_name)
              if not s.strip():
                  print(f'WARN: 缺签名资产 {sig_name}，跳过 {keys[0]}')
                  return
              url = f'{dl}/{url_name}'
              for k in keys:
                  entries[k] = {'signature': s, 'url': url}

          # 平台键与 tauri-action upload-version-json.ts 一致：
          # 主键 {os}-{arch}（Windows 优先 NSIS）+ 细分 {os}-{arch}-{installer}；
          # macOS universal 同时填 darwin-aarch64 / darwin-x86_64（含 -app 键）。
          # 资产名以 v0.1.0 实际上传为准：macOS 的 .app.tar.gz 无版本号（Cryptunnel.app.tar.gz）。
          add(['windows-x86_64', 'windows-x86_64-nsis'],
              f'Cryptunnel_{ver}_x64-setup.exe.sig', f'Cryptunnel_{ver}_x64-setup.exe')
          # MSI 文件名随 wix.language 区域变化（en-US / zh-CN ...），从实际上传资产动态发现，避免写死断链。
          msi_names = [n for n in assets if n.lower().endswith('.msi') and 'x64' in n]
          if msi_names:
              msi = sorted(msi_names)[0]
              add(['windows-x86_64-msi'], f'{msi}.sig', msi)
          else:
              print('WARN: 未找到 x64 .msi 资产，跳过 windows-x86_64-msi 条目')
          add(['darwin-aarch64', 'darwin-x86_64', 'darwin-aarch64-app', 'darwin-x86_64-app'],
              'Cryptunnel.app.tar.gz.sig', 'Cryptunnel.app.tar.gz')
          add(['linux-x86_64', 'linux-x86_64-appimage'],
              f'Cryptunnel_{ver}_amd64.AppImage.sig', f'Cryptunnel_{ver}_amd64.AppImage')
          add(['linux-x86_64-deb'],
              f'Cryptunnel_{ver}_amd64.deb.sig', f'Cryptunnel_{ver}_amd64.deb')

          if not entries:
              raise SystemExit('latest.json 平台条目为空 —— .sig 资产读取全失败')
          # notes 优先用发布时填写的说明（中文），没填则用中文兜底，绝不写死英文。
          body = (rel.get('body') or '').strip()
          notes = body if body else f'Cryptunnel v{ver} 发布'
          doc = {
              'version': ver,
              'notes': notes,
              'pub_date': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'platforms': entries,
          }
          with open('latest.json', 'w', encoding='utf-8') as f:
              json.dump(doc, f, indent=2)
          print(f'latest.json platforms: {len(entries)}')

          if 'latest.json' in assets:
              gh('-X', 'DELETE', f"repos/{repo}/releases/assets/{assets['latest.json']}")
              print('deleted existing latest.json')
          # 资产上传端点在 uploads.github.com（api.github.com 同路径 404，实测 404 vs 201）。
          # gh api --hostname 是给 GHE 用的（会拼 api.<host>，实测连 api.uploads.github.com 失败），
          # 这里直接用 curl 打全 URL，token 取自 GH_TOKEN 环境变量。
          token = subprocess.run(['printenv', 'GH_TOKEN'], capture_output=True, text=True).stdout.strip()
          up = subprocess.run([
              'curl', '-sS', '-f', '-X', 'POST',
              '-H', f'Authorization: Bearer {token}',
              '-H', 'Content-Type: application/json',
              '--data-binary', '@latest.json',
              f"https://uploads.github.com/repos/{repo}/releases/{rel['id']}/assets?name=latest.json",
          ], capture_output=True, text=True)
          if up.returncode != 0:
              raise SystemExit(f'latest.json 上传失败: {up.stderr[:500]}')
          print('latest.json uploaded')
          PYEOF
          cat latest.json
