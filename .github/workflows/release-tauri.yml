# Rust + Tauri 客户端（多平台）发布流水线：打 v* 标签时用 tauri-action 三平台打包并传到 GitHub Releases。
#
# 用法（版本号以 tauri.conf.json / Cargo.toml 为准，标签须与之对应）：
#   git tag v0.2.0
#   git push origin v0.2.0
#
# 产物（按平台，传到 Release 资产）：
#   Windows:  Cryptunnel_<ver>_x64-setup.exe / .msi  (+ .sig 更新签名)
#   macOS:    Cryptunnel_<ver>_universal.dmg / .app.tar.gz (+ .sig)
#   Linux:    Cryptunnel_<ver>_amd64.AppImage / .deb (+ .sig)
#   latest.json                                   更新清单（tauri-plugin-updater 据此找最新版）
#
# 更新签名（必配，否则 createUpdaterArtifacts 失败）：
#   1. 本地执行一次 `cargo tauri signer generate -w ~/.tauri/cryptunnel.key` 得到一对密钥
#   2. 公钥填进 src-tauri/tauri.conf.json 的 plugins.updater.pubkey
#   3. 私钥存到仓库 Secrets：TAURI_SIGNING_PRIVATE_KEY（及可选 TAURI_SIGNING_PRIVATE_KEY_PASSWORD）
#
# 注意：本 workflow 与 release.yml（.NET/WPF 客户端）相互独立，但都监听 v* 标签。
#       打标签前请确认要发的是哪一套，避免两套同时发（或后续拆分标签前缀）。

name: Release Tauri

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # 上传 Release 资产所需

jobs:
  release-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: universal-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version from tag
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "Releasing version $v"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # universal-apple-darwin 不是真实 rust target（rustup 装不了，v0.1.0 macOS 挂在
      # 「Install Rust」）。它是 tauri build 的 lipo 合并模式：需先装 x86_64 + aarch64
      # 两个真实 target，再只把 universal 传给 tauri build 的 --target。
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target == 'universal-apple-darwin' && 'x86_64-apple-darwin,aarch64-apple-darwin' || matrix.target }}

      # Linux 打包需要 webkit2gtk 等系统依赖（tauri 官方前置要求）
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: dotnet/rust/cryptunnel-crypto
          cache-on-failure: true

      # tauri-action 只负责「构建 + 平台打包 + 更新签名」，不接 Release 上传。
      # 我们的前端是纯静态（无构建步骤），故不设 beforeBuildCommand。
      #
      # 坑（v0.1.0 首发踩过，三平台全 "No artifacts were found"）：
      #   本仓库 cargo workspace 根在 cryptunnel-crypto/（target 目录共享），
      #   打包产物实际落在 cryptunnel-crypto/target/release/bundle/。
      #   而 tauri-action 的 workspace 检测只在「workspace 根 == src-tauri 父目录」时
      #   才对得上路径；本仓库 Tauri 项目根(cryptunnel-app)不是 workspace 根，
      #   action 错去 src-tauri/target/... 找 → 找不到。
      #   故 release 上传改为下面手动 glob（按真实产物路径），不依赖 action 的路径推断。
      - name: Build Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: dotnet/rust/cryptunnel-app
          args: --target ${{ matrix.target }}

      # 产物真实位置（v0.1.0 第三次 run 实锤，Windows job 日志 "Finished 2 bundles at"）：
      #   cryptunnel-crypto/target/<TARGET-TRIPLE>/release/bundle/<type>/
      # 中间有一层 /<target triple>/ —— 因为 cargo build 传了 --target。
      # 第二次 run 的 glob 漏了这一层（写成 target/release/bundle/...）→ 12 个
      # glob 全 "does not match any files"，job 却照样绿、草稿 0 资产（假成功）。
      # macOS 用 --target universal-apple-darwin 时该层目录名即 matrix.target 本身，
      # 故统一用 ${{ matrix.target }} 可覆盖三平台。
      #
      # fail_on_unmatched_files: true —— 再发生 glob 全 miss 直接红，消灭上述假成功。
      - name: Upload Release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Cryptunnel v${{ env.VERSION }}
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            dotnet/rust/cryptunnel-crypto/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            dotnet/rust/cryptunnel-crypto/target/${{ matrix.target }}/release/bundle/nsis/*.exe.sig
            dotnet/rust/cryptunnel-crypto/target/${{ matrix.target }}/release/bundle/msi/*.msi
            dotnet/rust/cryptunnel-crypto/target/${{ matrix.target }}/release/bundle/msi/*.msi.sig
            dotnet/rust/cryptunnel-crypto/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            dotnet/rust/cryptunnel-crypto/target/${{ matrix.target }}/release/bundle/dmg/*.dmg.sig
            dotnet/rust/cryptunnel-crypto/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            dotnet/rust/cryptunnel-crypto/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
            dotnet/rust/cryptunnel-crypto/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            dotnet/rust/cryptunnel-crypto/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage.sig
            dotnet/rust/cryptunnel-crypto/target/${{ matrix.target }}/release/bundle/deb/*.deb
            dotnet/rust/cryptunnel-crypto/target/${{ matrix.target }}/release/bundle/deb/*.deb.sig
